[project]
name = "report-llm"
version = "0.1.0"
description = "Structured pathology report extraction with modular LLM backends"
requires-python = ">=3.12"
dependencies = [
	"pydantic>=2.13,<3",
	"pyyaml>=6.0,<7",
]

[project.optional-dependencies]
hf = [
	"accelerate>=1.13",
	"gpustat>=1.1.1",
	"guidance>=0.3",
	"outlines>=1.3",
	"torch>=2.6,<2.7",
	"transformers>=5.8",
]
test = [
	"pytest>=8.4",
]

[dependency-groups]
hf = [
	"accelerate>=1.13",
	"gpustat>=1.1.1",
	"guidance>=0.3",
	"numpy>=1.24",
	"outlines>=1.3",
	"pandas>=2.0",
	"sentence-transformers>=2.2",
	"torch>=2.6,<2.7",
	"transformers>=5.8",
]
test = [
	"pytest>=8.4",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.report-llm.backends]
# Backend-specific dependency entrypoints.
hf = "requirements/hf/requirements.txt"
vllm = "requirements/vllm/requirements.txt"
sglang = "requirements/sglang/requirements.txt"
ollama = "requirements/ollama/requirements.txt"

[tool.report-llm.locks]
# uv.lock is the project lock for pyproject dependencies.
project = "uv.lock"
# Backend lock files are generated from the backend requirements files.
hf = "requirements/hf/lock.txt"
vllm = "requirements/vllm/lock.txt"
sglang = "requirements/sglang/lock.txt"
ollama = "requirements/ollama/lock.txt"