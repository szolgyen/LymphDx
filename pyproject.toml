[project]
name = "report-llm"
version = "0.1.0"
description = "Structured pathology report extraction with modular LLM backends"
requires-python = ">=3.11"
dependencies = [
	"pydantic>=2.13,<3",
]

[project.optional-dependencies]
hf = [
	"accelerate>=1.13",
	"outlines>=1.3",
	"torch>=2.12",
	"transformers>=5.8",
]
test = [
	"pytest>=8.4",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]