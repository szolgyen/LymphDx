# Evaluation configuration
# Use this file with:
#   python scripts/evaluate.py <run_name>
# where <run_name> is the experiment name (e.g., '20260701_100301')

# Paths
validation_file: inputs/NM_LN_validation.xlsx
diagnosis_dictionary: inputs/LN_Dx_dictionary_codes_20260824.xlsx

# Ontology matching mode
ontology_matching: true

# Ontology matching models
models:
  embedding_model: cambridgeltl/SapBERT-from-PubMedBERT-fulltext
  reranker_model: ncbi/MedCPT-Cross-Encoder
  classifier_model: google/medgemma-27b-it

# Matching parameters
matching:
  retrieval_k: 20
  acceptance_threshold: -10.0 # (essentially turned off for evaluation)
  use_prefilter: true
  use_classifier: true
  top_n: 5
  # Classifier parameters
  classifier_mode: "logits" # "logits" | "generate"
  classifier_batch_size: 16
  classifier_max_options: 10
  classifier_min_prob: 0.0
  classifier_max_new_tokens: 1024
  # Encoding parameters
  encode_batch_size: 64
  # Processing parameters
  chunk_size: 256

# Parameters
parameters:
  TOP_K_VALUES: [1, 3, 5]
  RARE_DIAGNOSIS_THRESHOLD: 2
  THRESHOLD_STEPS: 500
  GT_SHEET_NAME: "Sheet1"
  EXCLUDE_FAILED: true

# Group Terminology (customize the display names for each group)
group_terminology:
  group_1: "WHO-like Subcategories"
  group_2: "WHO-like Categories"
  group_3: "WHO-like Major Sections/Lineages"
  group_4: "Diagnostic Group 4"

major_group: group_4

# Output files (enable/disable outputs by setting true/false)
output_files:
  OUTPUT_SUMMARY: true
  OUTPUT_REPORT_LEVEL: true
  OUTPUT_HARD_CASES: true
  OUTPUT_ERROR_ANALYSIS: true
  OUTPUT_RARE_DIAGNOSIS: true
  OUTPUT_THRESHOLDS: true
  OUTPUT_THRESHOLD_PLOT: true
  OUTPUT_COVERAGE_ACCURACY_PLOT: true
  OUTPUT_ACCURACY_BREAKDOWN_GROUP_1: true
  OUTPUT_ACCURACY_BREAKDOWN_GROUP_2: true
  OUTPUT_ACCURACY_BREAKDOWN_GROUP_3: true
  OUTPUT_ACCURACY_BREAKDOWN_GROUP_4: true
  OUTPUT_CONFUSION_MATRIX_GROUP_1: true
  OUTPUT_CONFUSION_MATRIX_GROUP_2: true
  OUTPUT_CONFUSION_MATRIX_GROUP_3: true
  OUTPUT_CONFUSION_MATRIX_GROUP_4: true
  OUTPUT_CONTAINER_ACCURACY_BREAKDOWN_GROUP_1: true
  OUTPUT_CONTAINER_ACCURACY_BREAKDOWN_GROUP_2: true
  OUTPUT_CONTAINER_ACCURACY_BREAKDOWN_GROUP_3: true
  OUTPUT_CONTAINER_ACCURACY_BREAKDOWN_GROUP_4: true
  OUTPUT_CONTAINER_CONFUSION_MATRIX_GROUP_1: true
  OUTPUT_CONTAINER_CONFUSION_MATRIX_GROUP_2: true
  OUTPUT_CONTAINER_CONFUSION_MATRIX_GROUP_3: true
  OUTPUT_CONTAINER_CONFUSION_MATRIX_GROUP_4: true