# Evaluation configuration
# Use this file with:
#   python scripts/evaluate.py <run_name>
# where <run_name> is the experiment name (e.g., '20260701_100301')

# Paths
validation_file: ...
diagnosis_dictionary: inputs/LN_Dx_dictionary_codes_20260630.xlsx

# Ontology matching mode
ontology_matching: true

# Ontology matching models
models:
  embedding_model: cambridgeltl/SapBERT-from-PubMedBERT-fulltext
  reranker_model: ncbi/MedCPT-Cross-Encoder

# Matching parameters
matching:
  retrieval_k: 50
  acceptance_threshold: -10.0 # (essentially turned off for evaluation)
  use_prefilter: true
  top_n: 5

# Parameters
parameters:
  TOP_K_VALUES: [1, 3, 5]
  RARE_DIAGNOSIS_THRESHOLD: 2
  THRESHOLD_STEPS: 500
  GT_SHEET_NAME: "Results"
  EXCLUDE_FAILED: true

# Group Terminology (customize the display names for each group)
group_terminology:
  group_1: "Group1"
  group_2: "Group2"
  group_3: "Group3"

# Output files (enable/disable outputs by setting true/false)
output_files:
  OUTPUT_SUMMARY: true
  OUTPUT_REPORT_LEVEL: true
  OUTPUT_HARD_CASES: true
  OUTPUT_ERROR_ANALYSIS: true
  OUTPUT_RARE_DIAGNOSIS: true
  OUTPUT_THRESHOLDS: true
  OUTPUT_THRESHOLD_PLOT: true
  OUTPUT_COVERAGE_ACCURACY_PLOT: true
  OUTPUT_ACCURACY_BREAKDOWN_GROUP_1: true
  OUTPUT_ACCURACY_BREAKDOWN_GROUP_2: true
  OUTPUT_ACCURACY_BREAKDOWN_GROUP_3: true
  OUTPUT_CONFUSION_MATRIX_GROUP_1: true
  OUTPUT_CONFUSION_MATRIX_GROUP_2: true
  OUTPUT_CONFUSION_MATRIX_GROUP_3: true