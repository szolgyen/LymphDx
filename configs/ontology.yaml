# Ontology matching configuration
# Use this file with:
#   .venvs/report-llm-hf/bin/python scripts/ontology.py

# Ontology matching configuration

# File paths
input_file: ...
output_file: ...
ontology_file: ...

# Models
models:
  embedding_model: cambridgeltl/SapBERT-from-PubMedBERT-fulltext
  reranker_model: ncbi/MedCPT-Cross-Encoder

# Matching parameters
matching:
  retrieval_k: 50
  acceptance_threshold: -10.0
  use_prefilter: true
  top_n: 5
