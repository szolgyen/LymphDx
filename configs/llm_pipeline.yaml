# Hematopathology LLM pipeline configuration
# Use this file with:
#   .venvs/heme-llm-hf/bin/python scripts/run_pipeline.py

# Inference backend: hf | *vllm | *sglang | *ollama
backend: hf

# Model identifier: google/medgemma-4b-it | google/medgemma-1.5-4b-it | google/medgemma-27b-it | google/medgemma-4b-pt |aaditya/Llama3-OpenBioLLM-8B
model: google/medgemma-1.5-4b-it

# Decoder: none | guidance | outlines
decoder: none

# Schema version. Must match a class named schema_<version> in src/pathology_llm/schemas/pathology.py
schema: v5

# Input reports file (.txt one-per-line or .xlsx with Number/Final Diagnosis columns)
# input_file: configs/extraction/test_reports.xlsx
input_file: ...

# Text file with one allowed diagnosis per line
diagnosis_dictionary: inputs/LN_Dx_dictionary_codes_20260824.xlsx

# Directory for extracted JSON outputs
output_dir: outputs/

# Logging level: DEBUG | INFO | WARNING | ERROR | CRITICAL
log_level: INFO